# DNS over TLS.
#
# Sem isto, cada domínio que esta máquina consulta sai em texto puro e é lido
# por três saltos antes de chegar ao resolver: o roteador de casa, o roteador
# do provedor acima dele (a rede aqui é duplo NAT) e o provedor. Junto, isso é
# o seu histórico de navegação.
#
# Quad9: fundação suíça sem fins lucrativos, não comercializa dado de consulta
# e bloqueia domínios sabidamente maliciosos. Para trocar de resolver, mude as
# linhas DNS= — o formato é ENDEREÇO#nome-do-certificado.
#
# O "#dns.quad9.net" NÃO é comentário: é o nome usado para validar o
# certificado TLS. Sem ele, você cifra o canal sem saber com quem está
# falando, o que anula boa parte do ganho.
#
# Sem endereço IPv6 aqui de propósito: o provedor não entrega IPv6
# (IPv6连接类型: None no roteador), então IPv6 só renderia timeout.

[Resolve]
DNS=9.9.9.9#dns.quad9.net 149.112.112.112#dns.quad9.net

# Vazio de propósito. O systemd traz uma lista embutida (Cloudflare, Google)
# que ele usa quando o DNS= falha — em texto puro e sem você pedir. Deixar
# vazio garante que não existe caminho silencioso de volta pro plaintext.
FallbackDNS=

# "yes" é o modo estrito: se o DoT não subir, a resolução falha em vez de cair
# pra texto puro. É o certo para privacidade, mas quebra portal cativo de wifi
# público (a página de login não resolve). Nesse caso, temporariamente:
#   sudo resolvectl dnsovertls wlan0 no      # e "yes" de novo depois
DNSOverTLS=yes

# allow-downgrade: valida DNSSEC quando a zona suporta, sem quebrar as zonas
# mal configuradas que ainda existem. "yes" é mais rigoroso e quebra mais.
DNSSEC=allow-downgrade

# Faz destes servidores a rota padrão de DNS. Domínios de roteamento mais
# específicos continuam ganhando — é o que preserva o split-DNS da VPN
# (~empresa.com.br continua indo pelo tun0, não por aqui).
Domains=~.

Cache=yes
